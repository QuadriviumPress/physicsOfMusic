# Deploy the MyST HTML site to GitHub Pages via Bindery.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  deploy:
    uses: QuadriviumPress/bindery/.github/workflows/deploy.yml@main
    with:
      pre-build-command: bash scripts/fetch-exports.sh && node scripts/export-metadata.mjs prepare && npm run verify
      # `npx`, not a bare `myst`: mystmd is a local devDependency, and Bindery
      # runs build-command through a plain `run:` step rather than through npm,
      # so node_modules/.bin is not on PATH and a bare `myst` exits 127.
      build-command: npx myst build --html --check-links && node scripts/setup-pwa.mjs
      output-dir: _build/html
