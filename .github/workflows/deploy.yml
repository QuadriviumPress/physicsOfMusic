# Deploy the MyST HTML site to GitHub Pages via Bindery.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  deploy:
    uses: QuadriviumPress/bindery/.github/workflows/deploy.yml@main
    with:
      pre-build-command: bash scripts/fetch-exports.sh && node scripts/export-metadata.mjs prepare && npm run verify
      # The launcher invokes the local devDependency and works around MyST
      # 1.10.1's unreliable nested `npm --version` preflight.
      build-command: node scripts/run-myst.mjs build --html --check-links && node scripts/setup-pwa.mjs
      output-dir: _build/html
