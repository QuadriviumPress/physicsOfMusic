<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio example</title>
  <style>
    :root {
      color-scheme: light;
      --player-text: #1f2937;
      --player-error: #a32222;
      font-family: system-ui, sans-serif;
    }
    body { margin: 0; padding: .35rem .5rem; background: transparent; color: var(--player-text); }
    .name { margin: 0 0 .25rem; overflow: hidden; font-size: .82rem; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    audio { display: block; width: 100%; height: 2.5rem; }
    .error { color: var(--player-error); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --player-text: #f3f4f6;
        --player-error: #fca5a5;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --player-text: #f3f4f6;
      --player-error: #fca5a5;
    }
  </style>
</head>
<body>
  <p class="name" id="name">Audio example</p>
  <audio id="player" controls preload="metadata"></audio>
  <script>
    const params = new URLSearchParams(location.hash.slice(1));
    const src = params.get('src');
    const name = params.get('name') || 'Audio example';
    document.title = name;
    document.querySelector('#name').textContent = name;

    // The book's theme can differ from the operating-system preference. This
    // same-origin iframe therefore follows the theme class on the parent page,
    // including changes made by the theme toggle after the player has loaded.
    try {
      const parentRoot = window.parent === window ? null : window.parent.document.documentElement;
      const syncTheme = () => {
        document.documentElement.dataset.theme = parentRoot
          ? (parentRoot.classList.contains('dark') ? 'dark' : 'light')
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      };
      syncTheme();
      if (parentRoot) {
        new MutationObserver(syncTheme).observe(parentRoot, {
          attributes: true,
          attributeFilter: ['class']
        });
      }
    }
    catch {
      // Cross-origin embeds cannot inspect their parent; the media-query
      // fallback above still supplies a readable standalone player.
    }

    if (src) document.querySelector('#player').src = src;
    else {
      document.querySelector('#player').remove();
      document.querySelector('#name').classList.add('error');
      document.querySelector('#name').textContent = 'Audio source missing';
    }
  </script>
</body>
</html>
