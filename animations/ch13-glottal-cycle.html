<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One glottal cycle</title>
<link rel="stylesheet" href="lib/animlib.css">
</head>
<body>
<div class="anim-page">
  <canvas class="anim-canvas" id="canvas"></canvas>
  <div class="anim-controls" id="controls">
    <span class="anim-note">Opening is gradual; closing is abrupt -- the sharp closure is what makes the sound</span>
  </div>
</div>
<script type="module">
import { startLoop, makeMapper, plotCurve, drawZeroLine, plotPoint, COLORS, linspace } from './lib/animlib.js';

const canvas = document.getElementById( 'canvas' );
const controls = document.getElementById( 'controls' );

// Slowed well below any audible pitch so the eye can follow one cycle.
const PERIOD = 1.6; // seconds
const RISE_END = 0.45 * PERIOD;
const FALL_END = 0.55 * PERIOD;

function area( tMod ) {
  if ( tMod < RISE_END ) {
    const frac = tMod / RISE_END;
    return Math.pow( Math.sin( frac * Math.PI / 2 ), 2 );
  }
  if ( tMod < FALL_END ) {
    const frac = ( tMod - RISE_END ) / ( FALL_END - RISE_END );
    return Math.pow( Math.cos( frac * Math.PI / 2 ), 2 );
  }
  return 0;
}

function areaAt( t ) {
  return area( ( ( t % PERIOD ) + PERIOD ) % PERIOD );
}

function flowDerivative( t ) {
  const dt = 0.002;
  return ( areaAt( t + dt ) - areaAt( t - dt ) ) / ( 2 * dt );
}

function drawGlottis( ctx, t, width, height ) {
  const cx = width / 2;
  const cy = height / 2;
  const gap = areaAt( t );
  const halfGap = 4 + gap * Math.min( height * 0.28, 34 );
  const foldLength = Math.min( width * 0.7, 130 );

  ctx.save();
  ctx.fillStyle = COLORS.light;
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.ellipse( cx, cy, foldLength / 2, halfGap, 0, 0, 2 * Math.PI );
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = COLORS.blue;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo( cx - foldLength / 2, cy - halfGap );
  ctx.quadraticCurveTo( cx, cy - halfGap - 10, cx + foldLength / 2, cy - halfGap );
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo( cx - foldLength / 2, cy + halfGap );
  ctx.quadraticCurveTo( cx, cy + halfGap + 10, cx + foldLength / 2, cy + halfGap );
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.fillStyle = COLORS.gray;
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText( gap > 0.02 ? 'open' : 'closed', cx, height - 10 );
  ctx.textAlign = 'left';
  ctx.restore();
}

function drawTraces( ctx, t, width, height ) {
  const WINDOW = 2 * PERIOD;
  const SAMPLES = 400;
  const relTimes = linspace( 0, WINDOW, SAMPLES );
  const times = relTimes.map( r => t - WINDOW + r );
  const rowHeight = height / 2;

  ctx.save();
  const areaMapper = makeMapper( { width, height: rowHeight, xMin: 0, xMax: WINDOW, yMin: -0.15, yMax: 1.15, margin: 14 } );
  drawZeroLine( ctx, areaMapper, 0, WINDOW );
  plotCurve( ctx, areaMapper, relTimes, times.map( areaAt ), { color: COLORS.blue, lineWidth: 2 } );
  plotPoint( ctx, areaMapper, WINDOW, areaAt( t ), { color: COLORS.red, radius: 4 } );
  ctx.fillStyle = COLORS.gray;
  ctx.font = '11px sans-serif';
  ctx.fillText( 'glottal area', 6, 14 );
  ctx.restore();

  ctx.save();
  ctx.translate( 0, rowHeight );
  const flowMapper = makeMapper( { width, height: rowHeight, xMin: 0, xMax: WINDOW, yMin: -30, yMax: 15, margin: 14 } );
  drawZeroLine( ctx, flowMapper, 0, WINDOW );
  plotCurve( ctx, flowMapper, relTimes, times.map( flowDerivative ), { color: COLORS.red, lineWidth: 1.6 } );
  plotPoint( ctx, flowMapper, WINDOW, flowDerivative( t ), { color: COLORS.red, radius: 4 } );
  ctx.fillStyle = COLORS.gray;
  ctx.font = '11px sans-serif';
  ctx.fillText( 'rate of change of airflow', 6, 14 );
  ctx.restore();
}

function draw( ctx, t, width, height ) {
  const leftWidth = Math.min( width * 0.36, 170 );
  const rightWidth = width - leftWidth;

  ctx.save();
  drawGlottis( ctx, t, leftWidth, height );
  ctx.restore();

  ctx.save();
  ctx.translate( leftWidth, 0 );
  drawTraces( ctx, t, rightWidth, height );
  ctx.restore();
}

startLoop( { canvas, draw, controls, speed: 1 } );
</script>
</body>
</html>
