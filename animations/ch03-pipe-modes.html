<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pipe modes</title>
<link rel="stylesheet" href="lib/animlib.css">
</head>
<body>
<div class="anim-page">
  <canvas class="anim-canvas" id="canvas"></canvas>
  <div class="anim-controls" id="controls">
    <span class="anim-note">Open at both ends (left) vs. stopped at one end (right)</span>
  </div>
</div>
<script type="module">
import { startLoop, makeMapper, plotCurve, fillBetween, drawZeroLine, COLORS, linspace } from './lib/animlib.js';

const canvas = document.getElementById( 'canvas' );
const controls = document.getElementById( 'controls' );

const xs = linspace( 0, 1, 300 );
const BASE_OMEGA = Math.PI / 2;
const OPEN = [ { n: 1, label: 'f₁' }, { n: 2, label: '2f₁' }, { n: 3, label: '3f₁' } ];
const STOPPED = [ { n: 1, label: 'f₁' }, { n: 3, label: '3f₁' }, { n: 5, label: '5f₁' } ];

function drawWalls( ctx, mapper, closedLeft ) {
  ctx.save();
  ctx.strokeStyle = '#333333';
  ctx.lineWidth = 2.0;
  ctx.beginPath();
  ctx.moveTo( mapper.x( 0 ), mapper.y( 1.3 ) );
  ctx.lineTo( mapper.x( 1 ), mapper.y( 1.3 ) );
  ctx.moveTo( mapper.x( 0 ), mapper.y( -1.3 ) );
  ctx.lineTo( mapper.x( 1 ), mapper.y( -1.3 ) );
  ctx.stroke();
  if ( closedLeft ) {
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo( mapper.x( 0 ), mapper.y( -1.3 ) );
    ctx.lineTo( mapper.x( 0 ), mapper.y( 1.3 ) );
    ctx.stroke();
  }
  ctx.restore();
}

function drawColumn( ctx, mode, shapeFn, color, t, mapper, closedLeft, label ) {
  const shape = xs.map( shapeFn );
  fillBetween( ctx, mapper, xs, shape, shape.map( v => -v ), { color, alpha: 0.1 } );
  plotCurve( ctx, mapper, xs, shape, { color, lineWidth: 1.1, alpha: 0.3 } );
  plotCurve( ctx, mapper, xs, shape.map( v => -v ), { color, lineWidth: 1.1, alpha: 0.3 } );
  drawZeroLine( ctx, mapper, 0, 1 );
  const instant = shape.map( v => v * Math.cos( mode * BASE_OMEGA * t ) );
  plotCurve( ctx, mapper, xs, instant, { color, lineWidth: 2.2 } );
  drawWalls( ctx, mapper, closedLeft );
  ctx.fillStyle = color;
  ctx.font = '11px sans-serif';
  ctx.fillText( label, mapper.x( 1 ) + 6, mapper.y( 0 ) + 4 );
}

function draw( ctx, t, width, height ) {
  const rowHeight = height / 3;
  const colWidth = width / 2;

  for ( let row = 0; row < 3; row++ ) {
    ctx.save();
    ctx.translate( 0, row * rowHeight );
    const openMapper = makeMapper( { width: colWidth, height: rowHeight, xMin: -0.05, xMax: 1.1, yMin: -1.5, yMax: 1.5, margin: 14 } );
    drawColumn( ctx, OPEN[ row ].n, x => Math.cos( OPEN[ row ].n * Math.PI * x ), COLORS.blue, t, openMapper, false, OPEN[ row ].label );
    ctx.restore();

    ctx.save();
    ctx.translate( colWidth, row * rowHeight );
    const stoppedMapper = makeMapper( { width: colWidth, height: rowHeight, xMin: -0.05, xMax: 1.1, yMin: -1.5, yMax: 1.5, margin: 14 } );
    drawColumn( ctx, STOPPED[ row ].n, x => Math.sin( STOPPED[ row ].n * Math.PI * x / 2 ), COLORS.red, t, stoppedMapper, true, STOPPED[ row ].label );
    ctx.restore();
  }

  ctx.fillStyle = COLORS.gray;
  ctx.font = 'bold 11px sans-serif';
  ctx.fillText( 'Open at both ends', 8, 12 );
  ctx.fillText( 'Stopped at one end', colWidth + 8, 12 );
}

startLoop( { canvas, draw, controls, speed: 1 } );
</script>
</body>
</html>
