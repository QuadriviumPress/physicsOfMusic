<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modes of a circular membrane</title>
<link rel="stylesheet" href="lib/animlib.css">
</head>
<body>
<div class="anim-page">
  <canvas class="anim-canvas" id="canvas"></canvas>
  <div class="anim-controls" id="controls">
    <span class="anim-note">Red and blue regions swap every half period; the boundary between them is a nodal line</span>
  </div>
</div>
<script type="module">
import { startLoop, COLORS } from './lib/animlib.js';

const canvas = document.getElementById( 'canvas' );
const controls = document.getElementById( 'controls' );

const MODES = [
  { m: 0, n: 1, label: '(0,1)', ratio: 1.00 },
  { m: 1, n: 1, label: '(1,1)', ratio: 1.59 },
  { m: 2, n: 1, label: '(2,1)', ratio: 2.14 },
  { m: 0, n: 2, label: '(0,2)', ratio: 2.30 },
  { m: 3, n: 1, label: '(3,1)', ratio: 2.65 },
  { m: 1, n: 2, label: '(1,2)', ratio: 2.92 }
];
const HOLD = 2.4; // seconds shown per mode
const AMPLITUDE_PERIOD = 2.0; // seconds for one full breathing cycle

function shapeValue( r, theta, m, n ) {
  if ( r > 1 ) {
    return 0;
  }
  const radial = Math.cos( ( n - 0.5 ) * Math.PI * r );
  const angular = m === 0 ? 1 : Math.cos( m * theta );
  return radial * angular;
}

function draw( ctx, t, width, height ) {
  const idx = Math.floor( t / HOLD ) % MODES.length;
  const mode = MODES[ idx ];
  const phase = Math.cos( 2 * Math.PI * t / AMPLITUDE_PERIOD );

  const cx = width / 2;
  const cy = height / 2 + 8;
  const R = Math.min( width, height ) * 0.38;
  const step = 5;

  for ( let py = -R; py <= R; py += step ) {
    for ( let px = -R; px <= R; px += step ) {
      const x = px / R;
      const y = py / R;
      const r = Math.sqrt( x * x + y * y );
      if ( r > 1 ) {
        continue;
      }
      const theta = Math.atan2( y, x );
      const v = shapeValue( r, theta, mode.m, mode.n ) * phase;
      ctx.fillStyle = v >= 0 ? COLORS.red : COLORS.blue;
      ctx.globalAlpha = Math.min( 1, Math.abs( v ) * 1.05 );
      ctx.fillRect( cx + px - step / 2, cy + py - step / 2, step, step );
    }
  }
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.strokeStyle = COLORS.gray;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc( cx, cy, R, 0, 2 * Math.PI );
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = COLORS.gray;
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText( `mode ${ mode.label }`, 8, 18 );
  ctx.font = '11px sans-serif';
  ctx.fillText( `${ mode.ratio.toFixed( 2 ) } f₁`, 8, 34 );
}

startLoop( { canvas, draw, controls, speed: 1 } );
</script>
</body>
</html>
