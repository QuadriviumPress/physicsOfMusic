<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Attack, decay, sustain, release</title>
<link rel="stylesheet" href="lib/animlib.css">
</head>
<body>
<div class="anim-page">
  <canvas class="anim-canvas" id="canvas"></canvas>
  <div class="anim-controls" id="controls">
    <span class="anim-note">A plucked string has no sustain; a bowed note has no decay; a bell is a slow-decaying pluck</span>
  </div>
</div>
<script type="module">
import { startLoop, makeMapper, plotCurve, drawZeroLine, plotPoint, COLORS, linspace } from './lib/animlib.js';

const canvas = document.getElementById( 'canvas' );
const controls = document.getElementById( 'controls' );

const PERIOD = 3.6; // seconds for one full note cycle
const T_ATTACK = 0.6;
const T_DECAY = 1.1;
const T_SUSTAIN = 2.7;
const SUSTAIN_LEVEL = 0.55;

function idealEnvelope( t ) {
  if ( t < T_ATTACK ) {
    return t / T_ATTACK;
  }
  if ( t < T_DECAY ) {
    return 1 + ( t - T_ATTACK ) / ( T_DECAY - T_ATTACK ) * ( SUSTAIN_LEVEL - 1 );
  }
  if ( t < T_SUSTAIN ) {
    return SUSTAIN_LEVEL;
  }
  return SUSTAIN_LEVEL * ( 1 - ( t - T_SUSTAIN ) / ( PERIOD - T_SUSTAIN ) );
}

function pluckEnvelope( t ) {
  return Math.exp( -t / 0.7 );
}

function bowEnvelope( t ) {
  const releaseStart = PERIOD - 0.3;
  if ( t < 0.15 ) {
    return t / 0.15;
  }
  if ( t < releaseStart ) {
    return 1;
  }
  return Math.max( 0, 1 - ( t - releaseStart ) / 0.3 );
}

function bellEnvelope( t ) {
  return Math.exp( -t / 2.2 );
}

const xs = linspace( 0, PERIOD, 300 );

function drawEnvelopePanel( ctx, width, height, t, fn, color, label, segments ) {
  const mapper = makeMapper( { width, height, xMin: 0, xMax: PERIOD, yMin: 0, yMax: 1.1, margin: 14 } );
  drawZeroLine( ctx, mapper, 0, PERIOD );

  const full = xs.map( fn );
  plotCurve( ctx, mapper, xs, full, { color, lineWidth: 1.3, alpha: 0.3 } );

  const now = t % PERIOD;
  const revealed = xs.filter( x => x <= now );
  if ( revealed.length > 1 ) {
    plotCurve( ctx, mapper, revealed, revealed.map( fn ), { color, lineWidth: 2.2 } );
  }
  plotPoint( ctx, mapper, now, fn( now ), { color, radius: 4 } );

  if ( segments ) {
    ctx.save();
    ctx.strokeStyle = COLORS.light;
    ctx.setLineDash( [ 3, 3 ] );
    segments.forEach( x => {
      ctx.beginPath();
      ctx.moveTo( mapper.x( x ), mapper.y( 0 ) );
      ctx.lineTo( mapper.x( x ), mapper.y( 1.1 ) );
      ctx.stroke();
    } );
    ctx.restore();
  }

  ctx.save();
  ctx.fillStyle = COLORS.gray;
  ctx.font = '11px sans-serif';
  ctx.fillText( label, 6, 13 );
  ctx.restore();
}

function draw( ctx, t, width, height ) {
  const leftWidth = width * 0.42;
  const rightWidth = width - leftWidth;
  const now = t % PERIOD;

  // Left: the idealized four-stage envelope, with the active stage named.
  ctx.save();
  drawEnvelopePanel( ctx, leftWidth, height, t, idealEnvelope, COLORS.blue, 'Idealized envelope', [ T_ATTACK, T_DECAY, T_SUSTAIN ] );
  let stage = 'Release';
  if ( now < T_ATTACK ) {
    stage = 'Attack';
  }
  else if ( now < T_DECAY ) {
    stage = 'Decay';
  }
  else if ( now < T_SUSTAIN ) {
    stage = 'Sustain';
  }
  ctx.fillStyle = COLORS.red;
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText( stage, 6, height - 8 );
  ctx.restore();

  // Right: three real instrument shapes, stacked.
  ctx.save();
  ctx.translate( leftWidth, 0 );
  const rowHeight = height / 3;
  drawEnvelopePanel( ctx, rightWidth, rowHeight, t, pluckEnvelope, COLORS.green, 'Plucked string', null );
  ctx.translate( 0, rowHeight );
  drawEnvelopePanel( ctx, rightWidth, rowHeight, t, bowEnvelope, COLORS.orange, 'Bowed string', null );
  ctx.translate( 0, rowHeight );
  drawEnvelopePanel( ctx, rightWidth, rowHeight, t, bellEnvelope, COLORS.purple, 'Struck bell', null );
  ctx.restore();
}

startLoop( { canvas, draw, controls, speed: 1 } );
</script>
</body>
</html>
