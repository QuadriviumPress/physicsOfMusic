<svg pointer-events="none" stroke-width="1" stroke-dasharray="none" fill="black" stroke="black" shadowColor="black" font-size="10pt" font-weight="normal" font-style="normal" width="880" height="330" viewBox="0 0 880 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tuning-comparison-title tuning-comparison-description" preserveAspectRatio="xMidYMid meet"><title id="tuning-comparison-title">tuning comparison</title><desc id="tuning-comparison-description">A C major scale on a treble stave. Under each note are three numbers giving its deviation in cents from equal temperament in just intonation, in Pythagorean tuning, and in equal temperament itself. Just intonation puts E 14 cents flat and A 16 cents flat; Pythagorean puts E 8 cents sharp and B 10 cents sharp; equal temperament is zero throughout by definition.</desc><g class="notation-overlay"><text x="142" y="172" font-family="system-ui, sans-serif" font-size="14" text-anchor="end" font-weight="700" fill="#2e7d5b">just</text><text x="181" y="172" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#2e7d5b">0</text><text x="181" y="148" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="700">C</text><text x="254.671875" y="172" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#2e7d5b">+4</text><text x="254.671875" y="148" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="700">D</text><text x="328.34375" y="172" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#b33a3a">−14</text><text x="328.34375" y="148" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="700">E</text><text x="402.015625" y="172" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#2e7d5b">−2</text><text x="402.015625" y="148" font-family="system-ui, s